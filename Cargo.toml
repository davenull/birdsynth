[workspace]
resolver = "3"
members = ["crates/dsp", "crates/engine", "crates/engine-wasm", "crates/tools", "crates/tools-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
wt-dsp = { path = "crates/dsp" }
wt-engine = { path = "crates/engine" }
wt-tools = { path = "crates/tools" }

# The wasm engine is always built in release: DSP speed matters even in dev.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
