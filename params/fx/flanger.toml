# Flanger: a very short, swept delay mixed with the dry signal, making moving comb notches.

[group]
key = "fx.flanger"
name = "Flanger"
instances = ["1", "2", "3", "4"]
instance_names = ["Flanger 1", "Flanger 2", "Flanger 3", "Flanger 4"]

[[param]]
key = "enable"
name = "On"
curve = "bool"
default = 1
explain = "Switches the flanger on. Off, the signal passes through untouched (the change is faded, so it never clicks)."

[[param]]
key = "rate"
name = "Rate"
curve = "exp"
min = 0.01
max = 20.0
default = 0.3
unit = "Hz"
flags = ["mod"]
explain = "Speed of the modulation, in cycles per second (when BPM sync is off)."

[[param]]
key = "bpm"
name = "BPM Sync"
short = "BPM"
curve = "bool"
default = 0
explain = "Locks the modulation rate to the tempo."

[[param]]
key = "sync"
name = "Sync Rate"
short = "Length"
curve = "enum"
options = ["8 bars", "4 bars", "2 bars", "1 bar", "1/2", "1/4", "1/8", "1/16", "1/32", "1/64"]
default = 5
explain = "Length of one modulation cycle in musical time (when BPM sync is on)."

[[param]]
key = "depth"
name = "Depth"
curve = "lin"
min = 0.0
max = 1.0
default = 0.5
unit = "%"
flags = ["mod", "smooth"]
explain = "How far the delay sweeps."

[[param]]
key = "delay"
name = "Delay"
curve = "exp"
min = 0.1
max = 10.0
default = 1.0
unit = "ms"
flags = ["mod", "smooth"]
explain = "The shortest delay of the sweep: sets where the notches sit."

[[param]]
key = "feedback"
name = "Feedback"
curve = "lin"
min = -1.0
max = 1.0
default = 0.5
unit = "%"
flags = ["mod", "smooth"]
explain = "Sends the output back in: positive and negative values emphasise different harmonics."

[[param]]
key = "phase"
name = "Stereo"
curve = "lin"
min = 0.0
max = 180.0
default = 90.0
unit = "\u00b0"
flags = ["mod", "smooth"]
explain = "Offset between the left and right sweeps."

[[param]]
key = "mix"
name = "Mix"
curve = "lin"
min = 0.0
max = 1.0
default = 0.5
unit = "%"
flags = ["mod", "smooth"]
explain = "Balance between the dry signal and the flanged signal."
