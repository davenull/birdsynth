# Phaser: a chain of allpass stages swept by an LFO, making moving notches.

[group]
key = "fx.phaser"
name = "Phaser"
instances = ["1", "2", "3", "4"]
instance_names = ["Phaser 1", "Phaser 2", "Phaser 3", "Phaser 4"]

[[param]]
key = "enable"
name = "On"
curve = "bool"
default = 1
explain = "Switches the phaser on. Off, the signal passes through untouched (the change is faded, so it never clicks)."

[[param]]
key = "rate"
name = "Rate"
curve = "exp"
min = 0.01
max = 20.0
default = 0.3
unit = "Hz"
flags = ["mod"]
explain = "Speed of the modulation, in cycles per second (when BPM sync is off)."

[[param]]
key = "bpm"
name = "BPM Sync"
short = "BPM"
curve = "bool"
default = 0
explain = "Locks the modulation rate to the tempo."

[[param]]
key = "sync"
name = "Sync Rate"
short = "Length"
curve = "enum"
options = ["8 bars", "4 bars", "2 bars", "1 bar", "1/2", "1/4", "1/8", "1/16", "1/32", "1/64"]
default = 5
explain = "Length of one modulation cycle in musical time (when BPM sync is on)."

[[param]]
key = "depth"
name = "Depth"
curve = "lin"
min = 0.0
max = 1.0
default = 0.5
unit = "%"
flags = ["mod", "smooth"]
explain = "How far the notches sweep (up to 4 octaves)."

[[param]]
key = "freq"
name = "Freq"
curve = "exp"
min = 40.0
max = 10000.0
default = 800.0
unit = "Hz"
flags = ["mod", "smooth"]
explain = "Centre of the sweep."

[[param]]
key = "feedback"
name = "Feedback"
curve = "lin"
min = -1.0
max = 1.0
default = 0.5
unit = "%"
flags = ["mod", "smooth"]
explain = "Resonance of the notches (negative flips which harmonics it favours)."

[[param]]
key = "stages"
name = "Stages"
curve = "enum"
options = ["2", "4", "6", "8", "12"]
default = 2
explain = "Number of allpass stages: more stages make more notches."

[[param]]
key = "spread"
name = "Stereo"
curve = "lin"
min = 0.0
max = 180.0
default = 90.0
unit = "\u00b0"
flags = ["mod", "smooth"]
explain = "Offset between the left and right sweeps."

[[param]]
key = "mix"
name = "Mix"
curve = "lin"
min = 0.0
max = 1.0
default = 0.5
unit = "%"
flags = ["mod", "smooth"]
explain = "Balance between the dry signal and the phased signal."
