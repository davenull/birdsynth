# The sub oscillator: a simple band-limited shape, usually an octave down.

[group]
key = "sub"
name = "Sub"

[[param]]
key = "enable"
name = "Sub On"
short = "On"
curve = "bool"
default = 0
explain = "Switches the sub oscillator on."

[[param]]
key = "shape"
name = "Sub Shape"
short = "Shape"
curve = "enum"
options = ["Sine", "Round Rect", "Triangle", "Saw", "Square", "Pulse"]
default = 0
explain = "The sub's waveform. Sine adds pure weight; the brighter shapes add body you can hear on small speakers."

[[param]]
key = "octave"
name = "Sub Octave"
short = "Octave"
curve = "int"
min = -4
max = 2
default = -1
unit = "oct"
flags = ["mod"]
explain = "The sub's pitch in octaves from the note."

[[param]]
key = "level"
name = "Sub Level"
short = "Level"
curve = "lin"
min = 0.0
max = 1.0
default = 0.75
unit = "%"
flags = ["mod", "smooth"]
explain = "How loud the sub is."

[[param]]
key = "pan"
name = "Sub Pan"
short = "Pan"
curve = "lin"
min = -1.0
max = 1.0
default = 0.0
unit = "pan"
flags = ["mod", "smooth"]
explain = "Stereo position of the sub. Bass usually stays centred."

[[param]]
key = "route"
name = "Route"
curve = "enum"
options = ["Filter 1", "Filter 2", "Main", "Direct", "None"]
default = 2
explain = "Where it goes: into Filter 1 or Filter 2 (Split sends part of it to the other), straight to the main FX, direct to the output, or nowhere (still a modulation source)."

[[param]]
key = "balance"
name = "Filter Split"
short = "Split"
curve = "lin"
min = 0.0
max = 1.0
default = 0.0
unit = "%"
flags = ["mod", "smooth"]
explain = "How much goes to the other filter instead of the one Route picks: none at the left, all of it at the right, both in between. Only for the filter routes."

[[param]]
key = "send1"
name = "Bus 1 Send"
short = "Bus 1"
curve = "lin"
min = 0.0
max = 1.0
default = 0.0
unit = "%"
flags = ["mod", "smooth"]
explain = "How much also goes to FX Bus 1."

[[param]]
key = "send2"
name = "Bus 2 Send"
short = "Bus 2"
curve = "lin"
min = 0.0
max = 1.0
default = 0.0
unit = "%"
flags = ["mod", "smooth"]
explain = "How much also goes to FX Bus 2."
