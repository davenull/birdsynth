# The two filters.

[group]
key = "filter"
name = "Filter"
instances = ["1", "2"]
instance_names = ["Filter 1", "Filter 2"]

[[param]]
key = "enable"
name = "On"
curve = "bool"
default = 0
explain = "Switches the filter on. While it's off, the signal passes untouched."

[[param]]
key = "type"
name = "Type"
curve = "enum"
options = ["Low 12", "Low 24", "High 12", "High 24", "Band 12", "Band 24", "Notch 12", "Notch 24", "Ladder Low 6", "Ladder Low 12", "Ladder Low 18", "Ladder Low 24", "Low 6", "High 6", "Low 18", "High 18", "Low 36", "High 36", "Peak 12", "Peak 24", "Allpass 12", "Allpass 24", "Low Shelf", "High Shelf", "Bell", "Tilt", "Low-Band-High 12", "Low-Band-High 24", "Low-High 12", "Band-Notch 12", "Ladder High 24", "Ladder Band 12", "Dirty Ladder 24", "Smooth Ladder 24", "Acid 18", "Acid 24", "Diode 12", "Diode 24", "SK Low 12", "SK High 12", "SK Band 12", "Scream Low 12", "Scream High 12", "Comb +", "Comb -", "Flange +", "Flange -", "Dist Comb +", "Dist Comb -", "Allpass Comb", "Phaser 4 +", "Phaser 4 -", "Phaser 8 +", "Phaser 8 -", "Phaser 12 +", "Phaser 12 -", "Formant", "Formant Deep", "Formant Bright", "Ring Mod", "Sample & Hold", "Diffusor", "Band Reject"]
default = 0
explain = "The filter's shape. Low passes lows and cuts highs; High does the reverse; Band keeps a band around the cutoff; Notch removes one; the number is how steeply it cuts, in dB per octave. EQ types boost or cut (Resonance sets the gain), Multi types morph with Var, Ladders model four-stage transistor ladders, Sallen-Key types scream when pushed, Flanges are combs and phasers tuned by the cutoff, Formants make vowels (Var picks the vowel), and Misc holds ring modulation, sample & hold, a diffusor and a band reject."

[[param]]
key = "cutoff"
name = "Cutoff"
curve = "exp"
min = 20.0
max = 22000.0
default = 425.0
unit = "Hz"
flags = ["mod", "smooth"]
explain = "The frequency where the filter starts to act."

[[param]]
key = "res"
name = "Resonance"
short = "Res"
curve = "lin"
min = 0.0
max = 1.0
default = 0.1
unit = "%"
flags = ["mod", "smooth"]
explain = "Boosts frequencies right at the cutoff. High settings ring, and the ladder types sing on their own near the top."

[[param]]
key = "drive"
name = "Drive"
curve = "lin"
min = 0.0
max = 1.0
default = 0.0
unit = "%"
flags = ["mod", "smooth"]
explain = "Pushes the signal into saturation on the way into the filter, adding harmonics and grit."

[[param]]
key = "mix"
name = "Mix"
curve = "lin"
min = 0.0
max = 1.0
default = 1.0
unit = "%"
flags = ["mod", "smooth"]
explain = "Blend of the filtered signal with the dry signal."

[[param]]
key = "keytrack"
name = "Key Track"
short = "Key"
curve = "lin"
min = -1.0
max = 1.0
default = 0.0
unit = "%"
flags = ["mod"]
explain = "Moves the cutoff with the note played. At 100% the cutoff follows the keyboard exactly, so every note gets the same brightness."

[[param]]
key = "level"
name = "Level"
curve = "lin"
min = 0.0
max = 1.0
default = 1.0
unit = "%"
flags = ["mod", "smooth"]
explain = "The filter's output level."

[[param]]
key = "pan"
name = "Pan"
curve = "lin"
min = -1.0
max = 1.0
default = 0.0
unit = "pan"
flags = ["mod", "smooth"]
explain = "Stereo position of the filter's output."

[[param]]
key = "var"
name = "Var"
curve = "lin"
min = 0.0
max = 1.0
default = 0.5
unit = "%"
flags = ["mod", "smooth"]
explain = "The type's extra control: the morph position of the Multi types, the vowel of the Formants, the Q of the EQ types, the spread of the phasers, the brightness of the combs, and the waveform of the ring modulator."

[[param]]
key = "stereo"
name = "Stereo"
curve = "lin"
min = -1.0
max = 1.0
default = 0.0
unit = "oct"
flags = ["mod", "smooth"]
explain = "Spreads the cutoff between the left and right channels (up to an octave apart), widening the sound."
