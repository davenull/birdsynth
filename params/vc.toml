# Voice Control: an 8-step sequencer that runs in every voice from its
# note-on, with two lanes feeding the Voice Mod 1 and 2 sources.

[group]
key = "vc"
name = "Voice Control"

[[param]]
key = "rate"
name = "Voice Control Rate"
short = "Rate"
curve = "enum"
options = ["1/1", "1/2", "1/4", "1/8", "1/16", "1/32", "1/4 T", "1/8 T", "1/16 T"]
default = 4
explain = "How long each step lasts, at the tempo."

[[param]]
key = "steps"
name = "Voice Control Steps"
short = "Steps"
curve = "int"
min = 1.0
max = 8.0
default = 8.0
explain = "How many of the eight steps are used."

[[param]]
key = "smooth"
name = "Voice Control Smooth"
short = "Smooth"
curve = "lin"
min = 0.0
max = 1.0
default = 0.0
unit = "%"
explain = "Glides from one step's value to the next instead of jumping."

[[param]]
key = "loop"
name = "Voice Control Loop"
short = "Loop"
curve = "bool"
default = 1
explain = "Starts over after the last step. Off: stays on the last step."

[[param]]
key = "a1"
name = "Voice Mod 1 Step 1"
short = "1"
curve = "lin"
min = -1.0
max = 1.0
default = 0.0
flags = ["mod"]
explain = "The value Voice Mod 1 has during step 1."

