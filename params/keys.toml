# The keyboard: how played keys become notes.

[group]
key = "keys"
name = "Keyboard"

[[param]]
key = "transpose"
name = "Keyboard Transpose"
short = "Transpose"
curve = "int"
min = -24.0
max = 24.0
default = 0.0
unit = "st"
explain = "Moves every key you play by this many semitones."

[[param]]
key = "scale"
name = "Scale"
curve = "enum"
options = ["Off", "Major", "Minor", "Dorian", "Phrygian", "Lydian", "Mixolydian", "Locrian", "Harmonic Minor", "Melodic Minor", "Major Pentatonic", "Minor Pentatonic", "Blues", "Whole Tone"]
default = 0
explain = "Snaps every key to the nearest note of this scale, so any key you press fits."

[[param]]
key = "root"
name = "Scale Root"
short = "Key"
curve = "enum"
options = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"]
default = 0
explain = "The scale's first note."
