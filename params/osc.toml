# The three main oscillators, A, B and C. Each is an instance of the same set.

[group]
key = "osc"
name = "Oscillator"
instances = ["a", "b", "c"]
instance_names = ["Osc A", "Osc B", "Osc C"]

[[param]]
key = "enable"
name = "On"
curve = "bool"
default = [1, 0, 0]
explain = "Switches the oscillator on or off. An oscillator that's off costs no CPU."

[[param]]
key = "level"
name = "Level"
curve = "lin"
min = 0.0
max = 1.0
default = 0.75
unit = "%"
flags = ["mod", "smooth"]
explain = "How loud this oscillator is before it reaches the filters and the amp envelope."

[[param]]
key = "pan"
name = "Pan"
curve = "lin"
min = -1.0
max = 1.0
default = 0.0
unit = "pan"
flags = ["mod", "smooth"]
explain = "Places the oscillator left or right in the stereo field."

[[param]]
key = "octave"
name = "Octave"
curve = "int"
min = -4
max = 4
default = 0
unit = "oct"
flags = ["mod"]
explain = "Shifts the pitch in whole octaves: each step doubles or halves the frequency."

[[param]]
key = "semi"
name = "Semitone"
curve = "int"
min = -12
max = 12
default = 0
unit = "st"
flags = ["mod"]
explain = "Shifts the pitch in semitones, the steps between neighbouring piano keys. In Harmonics or Ratio mode it picks a harmonic instead."

[[param]]
key = "fine"
name = "Fine"
curve = "lin"
min = -100.0
max = 100.0
default = 0.0
unit = "ct"
flags = ["mod"]
explain = "Fine tuning in cents (hundredths of a semitone). Small offsets between oscillators make them beat against each other."

[[param]]
key = "coarse"
name = "Coarse"
curve = "lin"
min = -48.0
max = 48.0
default = 0.0
unit = "st"
flags = ["mod"]
explain = "A continuous pitch offset in semitones, for sweeps and glides."

[[param]]
key = "pitch_mode"
name = "Pitch Mode"
short = "Mode"
curve = "enum"
options = ["Semitones", "Harmonics", "Ratio"]
default = 0
explain = "How the Semitone control counts. Semitones: piano steps. Harmonics: the n-th harmonic of the note (negative values give subharmonics). Ratio: the n-th harmonic of Osc A's pitch."

[[param]]
key = "wt_pos"
name = "WT Position"
short = "WT Pos"
curve = "lin"
min = 0.0
max = 1.0
default = 0.0
unit = "%"
flags = ["mod", "smooth"]
explain = "Which frame of the wavetable plays. Sweeping it morphs the sound from one single-cycle waveform to the next."

[[param]]
key = "wt_smooth"
name = "Smooth Frames"
short = "Smooth"
curve = "bool"
default = 1
explain = "On: positions between frames blend the two neighbours, so sweeps are seamless. Off: the position snaps to the nearest frame, for stepped, digital sweeps."

[[param]]
key = "phase"
name = "Phase"
curve = "lin"
min = 0.0
max = 360.0
default = 180.0
unit = "deg"
flags = ["mod"]
explain = "Where in its cycle the oscillator starts each note."

[[param]]
key = "rand_phase"
name = "Random Phase"
short = "Rand"
curve = "lin"
min = 0.0
max = 1.0
default = 1.0
unit = "%"
explain = "How far each note's start phase is randomized. Random phases keep unison voices from starting in lockstep."

[[param]]
key = "phase_mem"
name = "Phase Memory"
short = "Memory"
curve = "bool"
default = 0
explain = "New notes continue from where the last note's oscillator left off instead of restarting."

[[param]]
key = "unison"
name = "Unison"
short = "Unison"
curve = "int"
min = 1
max = 16
default = 1
unit = "voices"
explain = "Stacks copies of the oscillator, each slightly detuned and spread across the stereo field, for a thick, chorused sound."

[[param]]
key = "detune"
name = "Unison Detune"
short = "Detune"
curve = "lin"
min = 0.0
max = 1.0
default = 0.25
unit = "%"
flags = ["mod", "smooth"]
explain = "How far apart the unison voices are tuned, up to the Range."

[[param]]
key = "blend"
name = "Unison Blend"
short = "Blend"
curve = "lin"
min = 0.0
max = 1.0
default = 0.75
unit = "%"
flags = ["mod", "smooth"]
explain = "Balance between the centre voice and the detuned side voices."

[[param]]
key = "width"
name = "Unison Width"
short = "Width"
curve = "lin"
min = 0.0
max = 1.0
default = 1.0
unit = "%"
flags = ["mod", "smooth"]
explain = "How widely the unison voices spread across the stereo field."

[[param]]
key = "uni_range"
name = "Unison Range"
short = "Range"
curve = "lin"
min = 0.0
max = 48.0
default = 2.0
unit = "st"
explain = "The widest detune, in semitones, that full Detune reaches."

[[param]]
key = "uni_mode"
name = "Unison Mode"
short = "Uni Mode"
curve = "enum"
options = ["Linear", "Super", "Exp", "Inv", "Random"]
default = 0
explain = "How the voices are spread between the extremes. Linear: evenly. Super: like the classic supersaw, dense near the centre. Exp: clustered at the centre. Inv: pushed to the edges. Random: new offsets every note."

[[param]]
key = "uni_stack"
name = "Unison Stack"
short = "Stack"
curve = "enum"
options = ["Off", "12", "24", "12+24", "+7", "+7+12", "Center -12", "Center -24"]
default = 0
explain = "Transposes some unison voices by octaves or fifths, to build chords and octave stacks from one oscillator."

[[param]]
key = "wt_spread"
name = "WT Spread"
curve = "lin"
min = 0.0
max = 1.0
default = 0.0
unit = "%"
flags = ["mod"]
explain = "Gives each unison voice a slightly different wavetable position."

[[param]]
key = "warp_spread"
name = "Warp Spread"
curve = "lin"
min = 0.0
max = 1.0
default = 0.0
unit = "%"
flags = ["mod"]
explain = "Gives each unison voice a slightly different warp amount."

[[param]]
key = "warp1_mode"
name = "Warp 1 Mode"
short = "Warp 1"
curve = "enum"
options = ["Off", "Sync", "Window Sync", "Bend +", "Bend -", "Bend +/-", "PWM", "Asym +", "Asym -", "Asym +/-", "Flip", "Mirror", "Remap 1", "Remap 2", "Remap 3", "Remap 4", "Quantize", "FM <- A", "FM <- B", "FM <- C", "FM <- Sub", "FM <- Noise", "FM <- Filter 1", "FM <- Filter 2", "PD <- A", "PD <- B", "PD <- C", "PD <- Sub", "PD <- Noise", "PD <- Filter 1", "PD <- Filter 2", "PD Self", "AM <- A", "AM <- B", "AM <- C", "AM <- Sub", "AM <- Noise", "AM <- Filter 1", "AM <- Filter 2", "RM <- A", "RM <- B", "RM <- C", "RM <- Sub", "RM <- Noise", "RM <- Filter 1", "RM <- Filter 2", "Soft Clip", "Hard Clip", "Soft Sat", "Tape Sat", "Tube", "Diode 1", "Diode 2", "Lin Fold", "Sin Fold", "Sine Shaper", "Asym Dist", "Stomp", "Zero-Square", "Lowpass", "Highpass", "Even/Odd"]
default = 0
explain = "The first warp: reshapes the waveform as it plays, by bending its timing, syncing it, or distorting it."

[[param]]
key = "warp1_amount"
name = "Warp 1 Amount"
short = "Warp 1"
curve = "lin"
min = 0.0
max = 1.0
default = 0.0
unit = "%"
flags = ["mod", "smooth"]
explain = "How strongly the first warp acts."

[[param]]
key = "warp2_mode"
name = "Warp 2 Mode"
short = "Warp 2"
curve = "enum"
options = ["Off", "Sync", "Window Sync", "Bend +", "Bend -", "Bend +/-", "PWM", "Asym +", "Asym -", "Asym +/-", "Flip", "Mirror", "Remap 1", "Remap 2", "Remap 3", "Remap 4", "Quantize", "FM <- A", "FM <- B", "FM <- C", "FM <- Sub", "FM <- Noise", "FM <- Filter 1", "FM <- Filter 2", "PD <- A", "PD <- B", "PD <- C", "PD <- Sub", "PD <- Noise", "PD <- Filter 1", "PD <- Filter 2", "PD Self", "AM <- A", "AM <- B", "AM <- C", "AM <- Sub", "AM <- Noise", "AM <- Filter 1", "AM <- Filter 2", "RM <- A", "RM <- B", "RM <- C", "RM <- Sub", "RM <- Noise", "RM <- Filter 1", "RM <- Filter 2", "Soft Clip", "Hard Clip", "Soft Sat", "Tape Sat", "Tube", "Diode 1", "Diode 2", "Lin Fold", "Sin Fold", "Sine Shaper", "Asym Dist", "Stomp", "Zero-Square", "Lowpass", "Highpass", "Even/Odd"]
default = 0
explain = "The second warp, applied after the first."

[[param]]
key = "warp2_amount"
name = "Warp 2 Amount"
short = "Warp 2"
curve = "lin"
min = 0.0
max = 1.0
default = 0.0
unit = "%"
flags = ["mod", "smooth"]
explain = "How strongly the second warp acts."

[[param]]
key = "route"
name = "Route"
curve = "enum"
options = ["Filter 1", "Filter 2", "Main", "Direct", "None"]
default = 0
explain = "Where the oscillator goes. Filter 1 or Filter 2: into that filter (Split sends part of it to the other). Main: skip the filters, into the main FX. Direct: skip filters and FX. None: silent, but still usable as a modulation source."

[[param]]
key = "balance"
name = "Filter Split"
short = "Split"
curve = "lin"
min = 0.0
max = 1.0
default = 0.0
unit = "%"
flags = ["mod", "smooth"]
explain = "How much of the oscillator goes to the other filter instead of the one Route picks: none at the left, all of it at the right, both in between. Only for the filter routes."

[[param]]
key = "send1"
name = "Bus 1 Send"
short = "Bus 1"
curve = "lin"
min = 0.0
max = 1.0
default = 0.0
unit = "%"
flags = ["mod", "smooth"]
explain = "How much of the oscillator also goes to FX Bus 1."

[[param]]
key = "send2"
name = "Bus 2 Send"
short = "Bus 2"
curve = "lin"
min = 0.0
max = 1.0
default = 0.0
unit = "%"
flags = ["mod", "smooth"]
explain = "How much of the oscillator also goes to FX Bus 2."

# --------------------------------------------------------------- P6: types
# Each oscillator can play a wavetable, or a recording four ways.

[[param]]
key = "type"
name = "Type"
curve = "enum"
options = ["Wavetable", "Sample", "Multisample", "Granular", "Spectral"]
default = 0
explain = "What the oscillator plays: a wavetable; a recording (Sample); a set of recordings across the keyboard (Multisample); short grains of a recording (Granular); or a recording rebuilt from its spectrum, so time and pitch are independent (Spectral)."

# --- the recording (Sample; Granular and Spectral play it too)

[[param]]
key = "smp_start"
name = "Sample Start"
short = "Start"
curve = "lin"
min = 0.0
max = 1.0
default = 0.0
unit = "%"
flags = ["mod", "smooth"]
explain = "Where in the recording each note starts."

[[param]]
key = "smp_end"
name = "Sample End"
short = "End"
curve = "lin"
min = 0.0
max = 1.0
default = 1.0
unit = "%"
flags = ["mod", "smooth"]
explain = "Where playback stops, and the furthest a loop can reach."

[[param]]
key = "loop_start"
name = "Loop Start"
short = "Loop In"
curve = "lin"
min = 0.0
max = 1.0
default = 0.0
unit = "%"
flags = ["mod", "smooth"]
explain = "Where the loop begins, as a share of the recording."

[[param]]
key = "loop_end"
name = "Loop End"
short = "Loop Out"
curve = "lin"
min = 0.0
max = 1.0
default = 1.0
unit = "%"
flags = ["mod", "smooth"]
explain = "Where the loop turns back."

[[param]]
key = "loop_mode"
name = "Loop Mode"
short = "Loop"
curve = "enum"
options = ["Off", "Forward", "Ping-Pong", "Reverse", "Tailed"]
default = 1
explain = "Off plays once; Forward repeats the loop; Ping-Pong goes back and forth; Reverse plays the loop backwards; Tailed loops while the key is held, then plays on to the end."

[[param]]
key = "xfade"
name = "Loop Crossfade"
short = "X-Fade"
curve = "lin"
min = 0.0
max = 0.5
default = 0.05
unit = "%"
flags = ["mod"]
explain = "Blends the end of the loop into the audio just before its start, so the jump back can't click. A share of the loop's length."

[[param]]
key = "snap"
name = "Loop Snap"
short = "Snap"
curve = "bool"
default = 1
explain = "Moves the loop points to the nearest zero crossings, another way to keep the loop from clicking."

[[param]]
key = "rate"
name = "Playback Rate"
short = "Rate"
curve = "lin"
min = 0.0
max = 2.0
default = 1.0
unit = "×"
flags = ["mod", "smooth"]
explain = "Speed on top of the note's pitch: 0.5 is an octave down. Sweep it to zero for a tape stop."

[[param]]
key = "root"
name = "Root Note"
short = "Root"
curve = "int"
min = 0.0
max = 127.0
default = 60.0
explain = "The key that plays the recording at its own pitch."

[[param]]
key = "keytrack"
name = "Key Track"
short = "Key"
curve = "bool"
default = 1
explain = "Higher keys play the recording higher. Off: every key plays it at its own pitch."

[[param]]
key = "slice"
name = "Slice Mode"
short = "Slices"
curve = "bool"
default = 0
explain = "Each key plays one slice of the recording, cut where its transients are: the root key plays the first slice, the key above the second."

[[param]]
key = "tail"
name = "Slice Tails"
short = "Tails"
curve = "bool"
default = 0
explain = "Lets a slice play on past its end instead of stopping at the next slice."

# --- granular

[[param]]
key = "gr_density"
name = "Grain Density"
short = "Density"
curve = "exp"
min = 1.0
max = 200.0
default = 25.0
unit = "/s"
flags = ["mod", "smooth"]
explain = "How many grains start each second."

[[param]]
key = "gr_length"
name = "Grain Length"
short = "Length"
curve = "exp"
min = 5.0
max = 1000.0
default = 100.0
unit = "ms"
flags = ["mod", "smooth"]
explain = "How long each grain lasts. Short grains buzz and blur; long ones overlap into a smooth cloud."

[[param]]
key = "gr_position"
name = "Grain Position"
short = "Position"
curve = "lin"
min = 0.0
max = 1.0
default = 0.0
unit = "%"
flags = ["mod", "smooth"]
explain = "Where in the recording the grains come from. With Scan at zero it stays put, which is the manual mode: move it by hand, with the XY pad, or with modulation."

[[param]]
key = "gr_scan"
name = "Grain Scan"
short = "Scan"
curve = "lin"
min = -2.0
max = 2.0
default = 1.0
unit = "×"
flags = ["mod", "smooth"]
explain = "How fast the position travels through the recording: 1 is its own speed, 0 holds still, negative goes backwards."

[[param]]
key = "gr_spray"
name = "Grain Spray"
short = "Spray"
curve = "lin"
min = 0.0
max = 1.0
default = 0.02
unit = "%"
flags = ["mod", "smooth"]
explain = "Scatters each grain's start around the position, as a share of the recording."

[[param]]
key = "gr_pitch_rand"
name = "Grain Pitch Random"
short = "Pitch Rnd"
curve = "lin"
min = 0.0
max = 12.0
default = 0.0
unit = "st"
flags = ["mod"]
explain = "Detunes each grain by a random amount up to this many semitones either way."

[[param]]
key = "gr_pan"
name = "Grain Pan Spread"
short = "Pan"
curve = "lin"
min = 0.0
max = 1.0
default = 0.5
unit = "%"
flags = ["mod"]
explain = "Places each grain at a random point across the stereo field, up to this wide."

[[param]]
key = "gr_window"
name = "Grain Window"
short = "Window"
curve = "enum"
options = ["Hann", "Triangle", "Tukey", "Rectangle", "Decay", "Swell"]
default = 0
explain = "The shape each grain fades in and out with: Hann is smooth, Rectangle clicks on purpose, Decay starts hard and fades, Swell the reverse."

[[param]]
key = "gr_direction"
name = "Grain Direction"
short = "Direction"
curve = "enum"
options = ["Forward", "Reverse", "Random"]
default = 0
explain = "Whether grains play forwards, backwards, or each one either way at random."

[[param]]
key = "gr_sync"
name = "Grain Pitch Sync"
short = "Sync"
curve = "bool"
default = 0
explain = "Starts grains at the note's frequency instead of the density, so the note sets the pitch and the recording sets the tone."

[[param]]
key = "gr_timbre"
name = "Grain Timbre"
short = "Timbre"
curve = "lin"
min = -24.0
max = 24.0
default = 0.0
unit = "st"
flags = ["mod", "smooth"]
explain = "Shifts the pitch inside each grain. With Pitch Sync it moves the tone's character (its formants) without changing the note."

[[param]]
key = "gr_loop"
name = "Grain Loop"
short = "Loop"
curve = "bool"
default = 1
explain = "When the position runs off the end of the recording, it goes round again instead of stopping."

# --- spectral

[[param]]
key = "sp_position"
name = "Spectral Position"
short = "Position"
curve = "lin"
min = 0.0
max = 1.0
default = 0.0
unit = "%"
flags = ["mod", "smooth"]
explain = "Where in the recording each note starts."

[[param]]
key = "sp_scan"
name = "Spectral Speed"
short = "Speed"
curve = "lin"
min = -2.0
max = 2.0
default = 1.0
unit = "×"
flags = ["mod", "smooth"]
explain = "How fast the recording plays, independent of its pitch: 0.5 lasts twice as long at the same pitch, 0 freezes the sound where it is."

[[param]]
key = "sp_low"
name = "Spectral Low Cut"
short = "Low"
curve = "exp"
min = 20.0
max = 20000.0
default = 20.0
unit = "Hz"
flags = ["mod", "smooth"]
explain = "Removes everything in the spectrum below this frequency."

[[param]]
key = "sp_high"
name = "Spectral High Cut"
short = "High"
curve = "exp"
min = 20.0
max = 20000.0
default = 20000.0
unit = "Hz"
flags = ["mod", "smooth"]
explain = "Removes everything above this frequency."

[[param]]
key = "sp_warp"
name = "Spectral Warp"
short = "Warp"
curve = "enum"
options = ["Off", "Smear", "Spread", "Detune +", "Detune -", "Bend +", "Bend -", "Harmonics", "Subharmonics", "Comb", "Pitch Shift", "Pitch Blend"]
default = 0
explain = "Reshapes the spectrum as it plays: Smear blurs it in time; Spread and Bend move partials apart; Detune shifts them all by the same number of hertz; Harmonics keeps only the note's harmonics; Subharmonics adds an octave below; Comb cuts regular notches; Pitch Shift moves it up to two octaves; Pitch Blend mixes in a copy an octave up."

[[param]]
key = "sp_warp_amt"
name = "Spectral Warp Amount"
short = "Amount"
curve = "lin"
min = 0.0
max = 1.0
default = 0.0
unit = "%"
flags = ["mod", "smooth"]
explain = "How strongly the spectral warp acts."

[[param]]
key = "sp_loop"
name = "Spectral Loop"
short = "Loop"
curve = "bool"
default = 1
explain = "Starts again from the beginning at the end of the recording. Off: it plays once."

[[param]]
key = "sp_filter"
name = "Spectral Filter"
short = "Filter"
curve = "bool"
default = 0
explain = "Shapes the spectrum with the curve you draw: each frequency gets the gain the curve has there."

# --- which notes and velocities it plays

[[param]]
key = "key_lo"
name = "Lowest Key"
short = "Key Lo"
curve = "int"
min = 0.0
max = 127.0
default = 0.0
explain = "The lowest key this oscillator plays (see Key Mode)."

[[param]]
key = "key_hi"
name = "Highest Key"
short = "Key Hi"
curve = "int"
min = 0.0
max = 127.0
default = 127.0
explain = "The highest key this oscillator plays."

[[param]]
key = "vel_lo"
name = "Lowest Velocity"
short = "Vel Lo"
curve = "int"
min = 0.0
max = 127.0
default = 0.0
explain = "The softest note this oscillator plays."

[[param]]
key = "vel_hi"
name = "Highest Velocity"
short = "Vel Hi"
curve = "int"
min = 0.0
max = 127.0
default = 127.0
explain = "The hardest note this oscillator plays."

[[param]]
key = "key_mode"
name = "Key Mode"
curve = "enum"
options = ["Range", "Fold", "Warp"]
default = 0
explain = "What happens outside the key range: Range stays silent; Fold plays it an octave or more closer so it lands inside; Warp squeezes the whole keyboard into the range."
