# The four envelopes. Env 1 always shapes the amplitude of every voice.

[group]
key = "env"
name = "Envelope"
instances = ["1", "2", "3", "4"]
instance_names = ["Env 1", "Env 2", "Env 3", "Env 4"]

[[param]]
key = "attack"
name = "Attack"
curve = "pow:3"
min = 0.0
max = 32000.0
default = 0.5
unit = "ms"
flags = ["mod"]
explain = "Time to rise from silence to full level after a key goes down."

[[param]]
key = "hold"
name = "Hold"
curve = "pow:3"
min = 0.0
max = 32000.0
default = 0.0
unit = "ms"
flags = ["mod"]
explain = "Time to stay at full level before the decay starts."

[[param]]
key = "decay"
name = "Decay"
curve = "pow:3"
min = 0.0
max = 32000.0
default = 1000.0
unit = "ms"
flags = ["mod"]
explain = "Time to fall from full level to the sustain level."

[[param]]
key = "sustain"
name = "Sustain"
curve = "lin"
min = 0.0
max = 1.0
default = 1.0
unit = "%"
flags = ["mod"]
explain = "The level held for as long as the key stays down."

[[param]]
key = "release"
name = "Release"
curve = "pow:3"
min = 0.0
max = 32000.0
default = 15.0
unit = "ms"
flags = ["mod"]
explain = "Time to fade to silence after the key comes up."
