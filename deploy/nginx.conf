# birdsynth. Vite names every asset by content hash, so /assets/ can be cached
# forever and only index.html needs revalidating after a deploy. /sync goes
# to the link service (server/relay.ts) running beside nginx.

# WebSocket upgrades pass through to the link service; plain requests close.
map $http_upgrade $connection_upgrade {
    default  upgrade;
    ''       close;
}

server {
    listen       8080;
    listen       [::]:8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;
    absolute_redirect off;

    # Visitors reaching the site through Cloudflare on plain HTTP get sent to
    # HTTPS: browsers only allow AudioWorklet on secure pages. Requests made
    # directly to the VM carry no CF-Visitor header and are served as they are.
    if ($http_cf_visitor ~* '"scheme":"http"') {
        return 301 https://$host$request_uri;
    }

    include      /etc/nginx/mime.types;
    types        { application/wasm wasm; }

    gzip             on;
    gzip_min_length  1024;
    gzip_types       text/css application/javascript application/json image/svg+xml application/wasm;

    # add_header in a location replaces the server's, so each location lists
    # the full set.
    location /assets/ {
        add_header  Cache-Control "public, max-age=31536000, immutable" always;
        add_header  X-Content-Type-Options "nosniff" always;
        try_files   $uri =404;
    }

    # The link service on 127.0.0.1:8002 (deploy/40-link-service.sh starts
    # it): a WebSocket at /sync, a health check at /sync/health. It groups
    # visitors by their address, which Cloudflare sends as CF-Connecting-IP
    # (passed on as it is); X-Forwarded-For is set for direct requests.
    location /sync {
        proxy_pass          http://127.0.0.1:8002;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade $http_upgrade;
        proxy_set_header    Connection $connection_upgrade;
        # as the browser sent it (with any port): the service checks the page's Origin against it
        proxy_set_header    Host $http_host;
        proxy_set_header    X-Forwarded-For $remote_addr;
        proxy_read_timeout  1h;
        proxy_send_timeout  1h;
        add_header  X-Content-Type-Options "nosniff" always;
    }

    location / {
        add_header  Cache-Control "no-cache" always;
        add_header  X-Content-Type-Options "nosniff" always;
        add_header  Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files   $uri $uri/ =404;
    }
}
