# birdsynth. Vite names every asset by content hash, so /assets/ can be cached
# forever and only index.html needs revalidating after a deploy.
server {
    listen       8080;
    listen       [::]:8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;
    absolute_redirect off;

    # Visitors reaching the site through Cloudflare on plain HTTP get sent to
    # HTTPS: browsers only allow AudioWorklet on secure pages. Requests made
    # directly to the VM carry no CF-Visitor header and are served as they are.
    if ($http_cf_visitor ~* '"scheme":"http"') {
        return 301 https://$host$request_uri;
    }

    include      /etc/nginx/mime.types;
    types        { application/wasm wasm; }

    gzip             on;
    gzip_min_length  1024;
    gzip_types       text/css application/javascript application/json image/svg+xml application/wasm;

    # add_header in a location replaces the server's, so each location lists
    # the full set. X-Robots-Tag stays until the public launch (P4).
    location /assets/ {
        add_header  Cache-Control "public, max-age=31536000, immutable" always;
        add_header  X-Content-Type-Options "nosniff" always;
        add_header  X-Robots-Tag "noindex" always;
        try_files   $uri =404;
    }

    location / {
        add_header  Cache-Control "no-cache" always;
        add_header  X-Content-Type-Options "nosniff" always;
        add_header  Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header  X-Robots-Tag "noindex" always;
        try_files   $uri $uri/ =404;
    }
}
