# Binary protocol between the host (main thread and worklet) and the engine.
#
# A command batch is a run of commands, each laid out as
#   u16 op · u16 reserved (0) · u32 payload bytes · f64 frame · payload
# with the payload padded to a multiple of 8 bytes. `frame` is the absolute
# audio frame the command applies at; 0 means "as soon as possible".
# Note-ons start at their exact frame; everything else lands on the next
# 16-frame control boundary.
#
# tools/gen-schema.mjs turns this file and params/*.toml into the Rust and
# TypeScript codecs. Changing anything here changes ABI_HASH.

[constants]
maxVoices = 32      # the polyphony limit
voiceSlots = 40     # extra slots let stolen voices fade out while new ones start
subBlock = 16       # control-rate grid, in frames
maxBlock = 2048     # most frames one wt_render call may produce
cmdCapacity = 262144
maxUnison = 16
maxModSlots = 64
maxFrames = 256     # frames per wavetable
frameLen = 2048     # samples per frame (the Serum format)
frameStride = 9227  # floats per mip-mapped frame: 9216 samples + 11 guards (see crates/dsp/src/mip.rs)
oscCount = 3
maxGrains = 512     # grains sounding at once across all voices (the oldest is stolen past this)
maxZones = 128      # multisample zones per oscillator
sampleLevels = 6    # the recording at full rate, then halved five times (for grains and samples pitched up)
specSize = 2048     # spectral oscillator: analysis and synthesis FFT size
specHop = 512       # and the hop between frames
specPre = 2         # analysis frames before time 0, so the first output sample is right (zero latency)
specFilterPoints = 64
arpSteps = 16       # steps in an arpeggiator pattern
arpBanks = 12       # patterns
arpLanes = 7        # per step: on, gate, velocity, chance, bend, strum, degree
clipSlots = 12
clipNotes = 512     # notes in one clip
clipLanes = 4       # automation lanes per clip
clipPoints = 64     # points per automation lane

[[command]]
name = "SetParam"
op = 1
doc = "Set a parameter to a normalized value in 0..1."
fields = [
  { name = "id", type = "u16" },
  { name = "value", type = "f32" },
]

[[command]]
name = "NoteOn"
op = 2
doc = "Start a note. noteId is chosen by the host and matched by NoteOff."
fields = [
  { name = "note", type = "u8" },
  { name = "channel", type = "u8" },
  { name = "velocity", type = "f32" },
  { name = "noteId", type = "u32" },
]

[[command]]
name = "NoteOff"
op = 3
doc = "Release a note: by noteId when it's non-zero, else by note and channel."
fields = [
  { name = "note", type = "u8" },
  { name = "channel", type = "u8" },
  { name = "velocity", type = "f32" },
  { name = "noteId", type = "u32" },
]

[[command]]
name = "AllNotesOff"
op = 4
doc = "Release every voice (MIDI CC 123)."
fields = []

[[command]]
name = "AllSoundOff"
op = 5
doc = "Fade every voice out within a few milliseconds (MIDI CC 120)."
fields = []

[[command]]
name = "PitchBend"
op = 6
doc = "Pitch wheel position, -1..1."
fields = [
  { name = "channel", type = "u8" },
  { name = "value", type = "f32" },
]

[[command]]
name = "Controller"
op = 7
doc = "A MIDI continuous controller, value 0..1."
fields = [
  { name = "channel", type = "u8" },
  { name = "cc", type = "u8" },
  { name = "value", type = "f32" },
]

[[command]]
name = "ChannelPressure"
op = 8
doc = "Channel aftertouch, 0..1."
fields = [
  { name = "channel", type = "u8" },
  { name = "value", type = "f32" },
]

[[command]]
name = "PolyPressure"
op = 9
doc = "Per-note aftertouch, 0..1."
fields = [
  { name = "note", type = "u8" },
  { name = "channel", type = "u8" },
  { name = "value", type = "f32" },
  { name = "noteId", type = "u32" },
]

[[command]]
name = "SetTaps"
op = 16
doc = "Choose which taps the engine records (bit i = tap i)."
fields = [{ name = "mask", type = "u32" }]

[[command]]
name = "Reset"
op = 17
doc = "Clear all DSP state (voices, smoothers, tails) but keep parameters."
fields = []

[[command]]
name = "LoadTable"
op = 20
doc = "Give an oscillator a wavetable: `bytes` of mip-mapped frames at `ptr` (from wt_asset_alloc). The engine takes ownership."
fields = [
  { name = "osc", type = "u8" },
  { name = "frames", type = "u16" },
  { name = "ptr", type = "u32" },
  { name = "bytes", type = "u32" },
]

[[command]]
name = "UpdateFrame"
op = 21
doc = "Overwrite one mip-mapped frame of an oscillator's table from an asset; the engine frees the asset."
fields = [
  { name = "osc", type = "u8" },
  { name = "index", type = "u16" },
  { name = "ptr", type = "u32" },
  { name = "bytes", type = "u32" },
]

[[command]]
name = "ResetTable"
op = 22
doc = "Return an oscillator to the built-in saw."
fields = [{ name = "osc", type = "u8" }]

[[command]]
name = "SetModSlot"
op = 24
doc = "Configure one modulation matrix slot. flags: bit 0 bipolar, bit 1 bypass. source 0 clears the slot. curve bends the source (-1..1); output scales the result."
fields = [
  { name = "slot", type = "u8" },
  { name = "source", type = "u8" },
  { name = "aux", type = "u8" },
  { name = "flags", type = "u8" },
  { name = "dest", type = "u16" },
  { name = "amount", type = "f32" },
  { name = "curve", type = "f32" },
  { name = "output", type = "f32" },
]

[[command]]
name = "SetLfoShape"
op = 26
doc = "An LFO's drawn shape (kind 0: points x, y, curve with x in 0..1 and y in -1..1) or path (kind 1: points x, y, curve in the XY plane). count points follow, three f32 each."
fields = [
  { name = "lfo", type = "u8" },
  { name = "kind", type = "u8" },
  { name = "count", type = "u16" },
]
tail = { type = "f32" }

[[command]]
name = "LoadSample"
op = 27
doc = "Give a sample slot (0: noise) mono f32 audio at ptr (from wt_asset_alloc) recorded at `rate` Hz. The engine takes ownership."
fields = [
  { name = "slot", type = "u8" },
  { name = "frames", type = "u32" },
  { name = "rate", type = "f32" },
  { name = "ptr", type = "u32" },
  { name = "bytes", type = "u32" },
]

[[command]]
name = "SetOscCurve"
op = 28
doc = "An oscillator's drawn remap curve (warps Remap 1-4), as a lookup table: count values in 0..1 over x from 0 to 1 (257 for full detail)."
fields = [
  { name = "osc", type = "u8" },
  { name = "count", type = "u16" },
]
tail = { type = "f32" }

[[command]]
name = "SetChain"
op = 29
doc = "An FX chain's modules, in order: chain 0 is the Main rack, 1 Bus 1, 2 Bus 2, and 3 + 3 × splitter + band the band chains of the splitters. Each entry is type × 256 + instance (types in fx/mod.rs order)."
fields = [
  { name = "chain", type = "u8" },
  { name = "count", type = "u8" },
]
tail = { type = "u16" }

[[command]]
name = "LoadIr"
op = 30
doc = "Give convolver `inst` an impulse response prepared by the tools (layout in crates/engine/src/fx/convolve.rs) at ptr (from wt_asset_alloc). taps = 0 removes it. The engine takes ownership."
fields = [
  { name = "inst", type = "u8" },
  { name = "taps", type = "u32" },
  { name = "ptr", type = "u32" },
  { name = "bytes", type = "u32" },
]

[[command]]
name = "SetTuning"
op = 32
doc = "The pitch of every MIDI note, as a fractional note number (count values, 128 for all; 12-TET is n → n). Scala, KBM and TUN files are turned into this by the host."
fields = [
  { name = "count", type = "u16" },
]
tail = { type = "f32" }

[[command]]
name = "LoadOscSample"
op = 33
doc = "Give an oscillator the recording its Sample and Granular types play: `levels` copies (full rate, then each half the length, low-passed), each `channels` planar runs of that level's frames, then `slices` f32 slice starts in frames. ptr from wt_asset_alloc (0 removes it); the engine takes ownership."
fields = [
  { name = "osc", type = "u8" },
  { name = "channels", type = "u8" },
  { name = "levels", type = "u8" },
  { name = "slices", type = "u16" },
  { name = "frames", type = "u32" },
  { name = "rate", type = "f32" },
  { name = "ptr", type = "u32" },
  { name = "bytes", type = "u32" },
]

[[command]]
name = "LoadMulti"
op = 34
doc = "Give an oscillator a multisample: `zones` zone headers of 16 f32 (see crates/engine/src/osc/multi.rs), then the zones' audio. ptr from wt_asset_alloc (0 removes it); the engine takes ownership."
fields = [
  { name = "osc", type = "u8" },
  { name = "zones", type = "u16" },
  { name = "ptr", type = "u32" },
  { name = "bytes", type = "u32" },
]

[[command]]
name = "LoadSpectral"
op = 35
doc = "Give an oscillator the spectral analysis its Spectral type plays: `frames` frames of specSize/2+1 magnitudes, as many phases and a transient flag, the first specPre of them before time 0; hop specHop at `rate`. ptr from wt_asset_alloc (0 removes it); the engine takes ownership."
fields = [
  { name = "osc", type = "u8" },
  { name = "frames", type = "u32" },
  { name = "rate", type = "f32" },
  { name = "ptr", type = "u32" },
  { name = "bytes", type = "u32" },
]

[[command]]
name = "SetSpectralFilter"
op = 36
doc = "The drawn spectral filter of an oscillator: `count` gains (0..1) spread evenly over log frequency from 20 Hz to 20 kHz."
fields = [
  { name = "osc", type = "u8" },
  { name = "count", type = "u16" },
]
tail = { type = "f32" }

[[command]]
name = "Transport"
op = 37
doc = "Start (1) or stop (0) the transport: clips play while it runs, and the tempo grid restarts at beat 0 on a start."
fields = [
  { name = "play", type = "u8" },
]

[[command]]
name = "SetArpPattern"
op = 38
doc = "An arpeggiator pattern: `count` floats, arpLanes lanes of arpSteps (on, gate, velocity, chance, bend in semitones, strum, degree)."
fields = [
  { name = "bank", type = "u8" },
  { name = "count", type = "u16" },
]
tail = { type = "f32" }

[[command]]
name = "SetClip"
op = 39
doc = "A clip's notes: `count` × 6 floats (start and length in beats, key, velocity, chance, bend in semitones), in start order, and its length in beats."
fields = [
  { name = "slot", type = "u8" },
  { name = "count", type = "u16" },
  { name = "length", type = "f32" },
]
tail = { type = "f32" }

[[command]]
name = "SetClipLane"
op = 40
doc = "One of a clip's automation lanes: parameter `param` (0xFFFF: none) at `count` points of (beat, normalized value)."
fields = [
  { name = "slot", type = "u8" },
  { name = "lane", type = "u8" },
  { name = "param", type = "u16" },
  { name = "count", type = "u16" },
]
tail = { type = "f32" }

[[command]]
name = "NoteExpression"
op = 41
doc = "Per-note (MPE) expression for the note `noteId`: kind 0 is X (its own pitch bend, -1..1), 1 is Y (slide, CC 74, 0..1), 2 is Z (pressure, 0..1)."
fields = [
  { name = "kind", type = "u8" },
  { name = "value", type = "f32" },
  { name = "noteId", type = "u32" },
]

[[command]]
name = "SetGuard"
op = 42
doc = "The CPU guard's level, set by the host when the load runs high: 0 none, 1 no oversampling, 2–4 also unison capped at 8, 4 and 2 voices. Patches are untouched."
fields = [{ name = "level", type = "u8" }]

[[command]]
name = "ClearMod"
op = 25
doc = "Clear every modulation slot."
fields = []

[[command]]
name = "Debug"
op = 31
doc = "Test hooks; see [debug]."
fields = [
  { name = "code", type = "u32" },
  { name = "arg", type = "f32" },
]

[debug]
Trap = 1            # panic inside the engine, to exercise trap recovery
Scalar = 2          # arg 1: render oscillators with the scalar reference kernel instead of SIMD
NoBandlimit = 3     # arg 1: read the full-detail wavetable at every pitch (the explainer's aliasing demo)

# Modulation sources, in matrix order. Indices are stable: append only.
[sources]
names = [
  "None",
  "Env 1", "Env 2", "Env 3", "Env 4",
  "Velocity", "Note", "Mod Wheel", "Pitch Bend", "Aftertouch", "Poly AT", "Release Vel",
  "Rand 1", "Rand 2", "Rand Discrete", "Voice Index", "Voice Mod 1", "Voice Mod 2", "Active Voices", "Fixed",
  "LFO 1", "LFO 2", "LFO 3", "LFO 4", "LFO 5", "LFO 6", "LFO 7", "LFO 8", "LFO 9", "LFO 10",
  "LFO 1 Y", "LFO 2 Y", "LFO 3 Y", "LFO 4 Y", "LFO 5 Y", "LFO 6 Y", "LFO 7 Y", "LFO 8 Y", "LFO 9 Y", "LFO 10 Y",
  "Macro 1", "Macro 2", "Macro 3", "Macro 4", "Macro 5", "Macro 6", "Macro 7", "Macro 8",
  "MPE X", "MPE Y", "MPE Z",
  "Osc A", "Osc B", "Osc C", "Sub", "Noise", "Filter 1", "Filter 2",
]

# Telemetry: f32 slots the engine refreshes on every render.
[[telemetry]]
name = "voicesActive"
[[telemetry]]
name = "peakL"
[[telemetry]]
name = "peakR"
[[telemetry]]
name = "focusVoice"   # slot of the most recent sounding voice, -1 if none
[[telemetry]]
name = "queueDrops"
[[telemetry]]
name = "unknownCmds"
[[telemetry]]
name = "voiceNote"    # MIDI note per voice slot, -1 when the slot is free
count = 40
[[telemetry]]
name = "voiceLevel"   # amp-envelope level per voice slot
count = 40
[[telemetry]]
name = "oscWtPos"     # the focused voice's wavetable position per oscillator, after modulation
count = 3
[[telemetry]]
name = "oscFrames"    # frames in each oscillator's table
count = 3
[[telemetry]]
name = "tableErrors"  # rejected LoadTable/UpdateFrame commands
[[telemetry]]
name = "focusPitch"   # the focused voice's pitch in semitones (MIDI note, glide included)
[[telemetry]]
name = "focusEnv"     # the focused voice's envelope levels
count = 4
[[telemetry]]
name = "focusCutoff"  # Filter 1 cutoff of the focused voice, Hz, after modulation
[[telemetry]]
name = "modSlots"     # active modulation slots
[[telemetry]]
name = "modDest"      # parameter id of each modulation destination, -1 when unused
count = 64
[[telemetry]]
name = "modValue"     # the focused voice's modulated (normalized) value of each destination
count = 64
[[telemetry]]
name = "lfoValue"     # the focused voice's LFO outputs (X), -1..1
count = 10
[[telemetry]]
name = "lfoY"         # Y outputs (Path and chaos types)
count = 10
[[telemetry]]
name = "lfoPhase"     # where each LFO is in its cycle, 0..1
count = 10
[[telemetry]]
name = "macroValue"   # the focused voice's macro values after modulation
count = 8
[[telemetry]]
name = "oversample"   # voice-path oversampling factor in use (1, 2 or 4)
[[telemetry]]
name = "fxGr"         # compressor gain reduction in dB (instance × 3 + band; single-band uses band 0)
count = 12
[[telemetry]]
name = "fxIr"         # convolver impulse response length in taps (0: none loaded)
count = 4
[[telemetry]]
name = "oscPlay"      # per oscillator: where the focused voice is in its recording (0..1; -1: not playing one)
count = 3
[[telemetry]]
name = "grains"       # grains sounding, across every voice
[[telemetry]]
name = "grainsStolen" # grains cut short because the pool was full (a running count)
[[telemetry]]
name = "oscAssets"    # per oscillator: frames of its recording, zones of its multisample, frames of its analysis (packed: see engine.rs)
count = 9
[[telemetry]]
name = "playing"      # 1 while the transport runs
[[telemetry]]
name = "beat"         # transport position in beats (free-running from the engine's start while stopped)
[[telemetry]]
name = "arpStep"      # the arpeggiator's step (-1: not playing)
[[telemetry]]
name = "clipPlaying"  # the clip slot playing (-1: none)
[[telemetry]]
name = "clipPos"      # where it is, in beats
[[telemetry]]
name = "seqNotes"     # notes the arp and clips have sounding now
[[telemetry]]
name = "guard"        # the CPU guard's level in effect (0: none; see SetGuard)

# Taps: signals the engine can record for scopes and the explainer.
[[tap]]
name = "master.l"
[[tap]]
name = "master.r"
[[tap]]
name = "focus.osc"    # the focused voice's oscillator output, before the amp
[[tap]]
name = "focus.out"    # the focused voice after the amp
[[tap]]
name = "focus.osc.a"  # each oscillator of the focused voice, mono, before the filter
[[tap]]
name = "focus.osc.b"
[[tap]]
name = "focus.osc.c"
[[tap]]
name = "focus.filter" # the focused voice after Filter 1, mono
[[tap]]
name = "focus.filter2" # after Filter 2, mono
[[tap]]
name = "focus.sub"
[[tap]]
name = "focus.noise"
[[tap]]
name = "bus.main"     # every voice on the main bus (after the filters), mono, before the Main rack
[[tap]]
name = "bus.direct"   # the direct bus (sources that skip the filters and FX), mono
[[tap]]
name = "bus.1"        # what the sources send to FX bus 1, mono, before its rack
[[tap]]
name = "bus.2"
[[tap]]
name = "fx.bus1"      # Bus 1's rack output, mono
[[tap]]
name = "fx.bus2"
[[tap]]
name = "fx.main"      # the Main rack's output (with any buses sent straight to the master), mono, before the direct bus and the volume"
